name: Deploy AKS infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-aks-arc
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
  INFRA_TF_STATE_KEY: ${{ vars.INFRA_TF_STATE_KEY }}

jobs:
  deploy:
    name: Provision infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${INFRA_TF_STATE_KEY}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}" \
            -backend-config="client_id=${ARM_CLIENT_ID}" \
            -backend-config="use_azuread_auth=true"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        run: terraform validate

      - name: Plan AKS infrastructure
        run: |
          terraform plan \
            -out=aks.tfplan \
            -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -var="tenant_id=${ARM_TENANT_ID}"

      - name: Apply AKS infrastructure
        run: terraform apply -auto-approve aks.tfplan

      - name: Write deployment summary
        run: |
          {
            echo "## AKS infrastructure deployed"
            echo "* AKS: $(terraform output -raw aks_cluster_name)"
          } >> "$GITHUB_STEP_SUMMARY"
